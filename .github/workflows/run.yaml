name: Qualys WAS Scanner For GitHub Demo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Grant execute permissions to mvnw
        run: chmod +x ./mvnw
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Build Spring Boot App
        run: ./mvnw clean package
      
      - name: Store Maven dependencies in cache
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      
      - name: Archive JAR Artifact
        uses: actions/upload-artifact@v3
        with:
          name: GitHubActions-Artifact
          path: target/GitHubActions-0.0.1-SNAPSHOT.jar
  
  run:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'
      
      - name: Download JAR Artifact
        uses: actions/download-artifact@v3
        with:
          name: GitHubActions-Artifact
          path: ./
          
      - name: Checkout config repository
        uses: actions/checkout@v3
        with:
          repository: TheLogicalNights/config-repo
          ref: main
          path: src/main/resources/
          token: ${{ secrets.ACCESS_TOKEN }}
      
      - name: Read configuration file
        id: read-config
        run: |
          CONFIG=$(cat src/main/resources/config.json)
          echo "USE_PROXY=$(echo "$CONFIG" | jq -r '.params.useProxy')" >> $GITHUB_ENV
          echo "USERNAME=$(echo "$CONFIG" | jq -r '.params.username')" >> $GITHUB_ENV
          echo "PASSWORD=$(echo "$CONFIG" | jq -r '.params.password')" >> $GITHUB_ENV
          echo "SERVER=$(echo "$CONFIG" | jq -r '.params.server')" >> $GITHUB_ENV
          echo "SCAN_ID=$(echo "$CONFIG" | jq -r '.params.scanId')" >> $GITHUB_ENV
        shell: bash
      
      #      - name: Use secrets and variables from config
      #        run: |
      #          # Use the values in your workflow
      #          echo "USE_PROXY: ${USE_PROXY}"
      #          echo "USERNAME: ${USERNAME}"
      #          echo "PASSWORD: ${PASSWORD}"
      #          echo "SERVER: ${SERVER}"
      #        shell: bash
      
      - name: Run Spring Boot App
        run: java -jar ./GitHubActions-0.0.1-SNAPSHOT.jar
        env:
          USE_PROXY: ${{ env.USE_PROXY }}
          USERNAME: ${{ env.USERNAME }}
          PASSWORD: ${{ env.PASSWORD }}
          SERVER: ${{ env.SERVER }}
          SCAN_ID: ${{ env.SCAN_ID }}