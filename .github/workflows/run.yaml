name: Qualys WAS Scan GitHub Actions

on:
  push:
    branches:
      - feature/QINT-22486-IDP
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setting up GitHub Repository
        uses: actions/checkout@v4
        env:
          ACTION_REF: ${{ github.sha }}
        with:
          repository: aanandedkar/github_WAS_IDP_TEST
          ref: ${{ env.ACTION_REF }}
          path: qwas-action

      - name: Setting up Maven Wrapper
        run: chmod +x ./mvnw
        working-directory: qwas-action

      - name: Setting up Java Environment
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      - name: Caching Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('qwas-action/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Building plugin with Maven
        run: pwd && ./mvnw clean package
        working-directory: qwas-action

      - name: Spinning up Qualys WAS Scan Plugin
        run: java -jar ./target/github-was-action.jar
        id: run-app
        working-directory: qwas-action
        env:
          API_SERVER: ${{ vars.API_SERVER }}
          AUTH_TYPE: ${{ vars.AUTH_TYPE }}
          QUALYS_USERNAME: ${{ vars.QUALYS_USERNAME }}
          QUALYS_PASSWORD: ${{ secrets.QUALYS_PASSWORD }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          IDP_TOKEN_URL: ${{ vars.IDP_TOKEN_URL }}
          IDP_SCOPE: ${{ vars.IDP_SCOPE }}
          IDP_AUDIENCE: ${{ vars.IDP_AUDIENCE }}
          WEBAPP_ID: ${{ vars.WEBAPP_ID }}
          SCAN_NAME: ${{ vars.SCAN_NAME }}
          SCAN_TYPE: ${{ vars.SCAN_TYPE }}
          AUTH_RECORD: ${{ vars.AUTH_RECORD }}
          AUTH_RECORD_ID: ${{ vars.AUTH_RECORD_ID }}
          OPTION_PROFILE: ${{ vars.OPTION_PROFILE }}
          OPTION_PROFILE_ID: ${{ vars.OPTION_PROFILE_ID }}
          CANCEL_OPTION: ${{ vars.CANCEL_OPTION }}
          CANCEL_HOURS: ${{ vars.CANCEL_HOURS }}
          SEVERITY_CHECK: ${{ vars.SEVERITY_CHECK }}
          SEVERITY_LEVEL: ${{ vars.SEVERITY_LEVEL }}
          EXCLUDE: ${{ vars.EXCLUDE }}
          FAIL_ON_SCAN_ERROR: ${{ vars.FAIL_ON_SCAN_ERROR }}
          WAIT_FOR_RESULT: ${{ vars.WAIT_FOR_RESULT }}
          INTERVAL: ${{ vars.INTERVAL }}
          TIMEOUT: ${{ vars.TIMEOUT }}
          FILE_TYPE: ${{ vars.FILE_TYPE }}
          SEND_MAIL: ${{ vars.SEND_MAIL }}
        continue-on-error: true

      - name: Uploading Qualys WAS Scan Result
        uses: actions/upload-artifact@v4
        with:
          name: Qualys_WAS_Scan_Result
          path: qwas-action/outputs/
          retention-days: 7

      - name: Checking for Qualys WAS Scan Plugin Failure
        if: steps.run-app.outcome != 'success'
        run: exit 1
