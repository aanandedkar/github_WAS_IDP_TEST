name: Qualys WAS Scan GitHub Actions

on:
  push:
    branches:
      - feature/QINT-22486-IDP
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'

      - name: Verify Maven Wrapper checksums
        run: |
          echo "--- Expected checksums from maven-wrapper.properties ---"
          grep -E "Sha256Sum" .mvn/wrapper/maven-wrapper.properties
          echo "--- Actual SHA-256 of committed maven-wrapper.jar ---"
          sha256sum .mvn/wrapper/maven-wrapper.jar
          echo "--- Running mvnw (validates wrapper JAR, then downloads & validates Maven dist) ---"
          chmod +x ./mvnw
          ./mvnw -v
          echo "--- Actual SHA-256 of downloaded Maven distribution ---"
          find ~/.m2/wrapper/dists -name "apache-maven-*-bin.zip" -exec sha256sum {} \;

      - name: Build Spring Boot App
        run: ./mvnw clean package

      - name: Run Spring Boot App
        run: java -jar ./target/GitHubActionsQWas-0.0.1-SNAPSHOT.jar
        id: run-app
        env:
          API_SERVER: ${{ vars.API_SERVER }}
          AUTH_TYPE: ${{ vars.AUTH_TYPE }}
          QUALYS_USERNAME: ${{ vars.QUALYS_USERNAME }}
          QUALYS_PASSWORD: ${{ secrets.QUALYS_PASSWORD }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          IDP_TOKEN_URL: ${{ vars.IDP_TOKEN_URL }}
          IDP_SCOPE: ${{ vars.IDP_SCOPE }}
          IDP_AUDIENCE: ${{ vars.IDP_AUDIENCE }}
          WEBAPP_ID: ${{ vars.WEBAPP_ID }}
          SCAN_NAME: ${{ vars.SCAN_NAME }}
          SCAN_TYPE: ${{ vars.SCAN_TYPE }}
          AUTH_RECORD: ${{ vars.AUTH_RECORD }}
          AUTH_RECORD_ID: ${{ vars.AUTH_RECORD_ID }}
          OPTION_PROFILE: ${{ vars.OPTION_PROFILE }}
          OPTION_PROFILE_ID: ${{ vars.OPTION_PROFILE_ID }}
          CANCEL_OPTION: ${{ vars.CANCEL_OPTION }}
          CANCEL_HOURS: ${{ vars.CANCEL_HOURS }}
          SEVERITY_CHECK: ${{ vars.SEVERITY_CHECK }}
          SEVERITY_LEVEL: ${{ vars.SEVERITY_LEVEL }}
          EXCLUDE: ${{ vars.EXCLUDE }}
          FAIL_ON_SCAN_ERROR: ${{ vars.FAIL_ON_SCAN_ERROR }}
          WAIT_FOR_RESULT: ${{ vars.WAIT_FOR_RESULT }}
          INTERVAL: ${{ vars.INTERVAL }}
          TIMEOUT: ${{ vars.TIMEOUT }}
          FILE_TYPE: ${{ vars.FILE_TYPE }}
          SEND_MAIL: ${{ vars.SEND_MAIL }}
        continue-on-error: true

      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: Qualys_WAS_Scan_Result
          path: ./outputs
          if-no-files-found: ignore
          retention-days: 7

      - name: Check build status
        if: steps.run-app.outcome != 'success'
        run: exit 1
